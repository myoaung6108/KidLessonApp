name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: |
          npx cap init "ကလေးများ သင်ထောက်ကူ" "com.example.kidlesson" --web-dir .
          npx cap add android
          npx cap sync

      - name: Setup Android SDK & Accept Licenses
        run: |
          # SDK ကို ကိုယ်တိုင် Download လုပ်ပြီး License အားလုံးကို အလိုအလျောက် လက်ခံခိုင်းခြင်း
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk.zip
          unzip -q sdk.zip -d $ANDROID_HOME
          mv $ANDROID_HOME/cmdline-tools $ANDROID_HOME/latest
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/latest $ANDROID_HOME/cmdline-tools/
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          # License တွေကို 'yes' လို့ အလိုအလျောက် ဖြေခိုင်းခြင်း
          yes | sdkmanager --licenses
          
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidLesson-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidLesson-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
